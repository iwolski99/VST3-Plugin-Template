name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev \
            libasound2-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFOUNDRY_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # find -exec always exits 0, so run the binary directly - otherwise a
      # failing test is reported as a passing build.
      - name: Run engine tests
        shell: bash
        run: |
          bin=$(find build \( -iname "FoundryEngineTest" -o -iname "FoundryEngineTest.exe" \) -type f | head -1)
          test -n "$bin" || { echo "FoundryEngineTest was not built"; exit 1; }
          "$bin"

      - name: Run playback tests
        shell: bash
        run: |
          bin=$(find build \( -iname "FoundryPlaybackTest" -o -iname "FoundryPlaybackTest.exe" \) -type f | head -1)
          test -n "$bin" || { echo "FoundryPlaybackTest was not built"; exit 1; }
          "$bin"

      - name: Run lifecycle tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin=$(find build -iname "FoundryLifecycleTest" -type f -perm -u+x | head -1)
          test -n "$bin" || { echo "FoundryLifecycleTest was not built"; exit 1; }
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$bin"
          else
            "$bin"
          fi
