name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev \
            libasound2-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTEMPLATE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          find build -iname "TemplateDspTest" -type f -perm -u+x -exec {} \; -quit
          find build -iname "TemplateLifecycleTest" -type f -perm -u+x -exec {} \; -quit
